name: build-goldfish-ksu

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "KernelSU tag / branch"
        required: true
        default: "v3.3.1"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-goldfish-ksu.yml"
      - "stock.config"
      - "ksu-syscall-hook.patch"

env:
  KSU_REF: ${{ github.event.inputs.ksu_ref || 'v3.3.1' }}
  # 原版 kernel-ranchu 的精确源码提交（kernel/common，与版本号 5.10.43-android12-9-00039-g62a5f8e3accf-ab7647044 对应）
  KERNEL_SHA: "62a5f8e3accffd371afdff1652975e80d7dab30e"
  EXPECTED_RELEASE: "5.10.43-android12-9-00039-g62a5f8e3accf-ab7647044"
  # 在 /tmp 下编译：避免 setlocalversion 发现上层 .git 给版本号追加 "+"
  BUILD_DIR: "/tmp/ksu"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repo (stock.config)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves rsync cpio kmod zstd \
            clang lld llvm python3 make git curl

      - name: Download exact kernel source (kernel/common @ stock commit)
        run: |
          set -euxo pipefail
          mkdir -p "$BUILD_DIR/common" && cd "$BUILD_DIR"
          curl -fL --retry 3 -o ksrc.tar.gz \
            "https://codeload.github.com/aosp-mirror/kernel_common/tar.gz/${KERNEL_SHA}"
          ls -lh ksrc.tar.gz
          tar -xzf ksrc.tar.gz -C "$BUILD_DIR/common" --strip-components=1
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' "$BUILD_DIR/common/Makefile"

      - name: Clone KernelSU
        run: |
          git clone --depth 1 --branch "$KSU_REF" https://github.com/tiann/KernelSU.git "$BUILD_DIR/KernelSU"
          # 修复 5.10 上 do_syscall_64 入口钩子导致的 panic（改用 .entry.text 汇编跳板）
          git -C "$BUILD_DIR/KernelSU" apply -v "$GITHUB_WORKSPACE/ksu-syscall-hook.patch"
          sed -n '215,340p' "$BUILD_DIR/KernelSU/kernel/hook/x86_64/syscall_hook.c"
          ls "$BUILD_DIR/KernelSU/kernel"

      - name: Integrate KernelSU into kernel tree
        run: |
          cd "$BUILD_DIR/common"
          ln -sfn "$BUILD_DIR/KernelSU/kernel" drivers/kernelsu
          # 该树没有 drivers/Kbuild（GKI 已并入 drivers/Makefile）；绝不能新建 Kbuild，否则它会顶替 Makefile 导致整个 drivers 不编译
          if [ -f drivers/Kbuild ]; then kb=drivers/Kbuild; else kb=drivers/Makefile; fi
          echo "use $kb"
          grep -q 'CONFIG_KSU' "$kb" || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> "$kb"
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          tail -2 "$kb"
          tail -2 drivers/Kconfig

      - name: Fix LLVM toolchain version detection (so LTO/CFI are not dropped)
        run: |
          # 5.10 的 arch/Kconfig 用 `--version | grep -q llvm-ar / llvm-nm / LLD` 探测工具链。
          # Ubuntu 的 llvm-ar/llvm-nm 输出 "Ubuntu LLVM version 14.0.0"，不含 "llvm-ar"/"llvm-nm"，
          # ld.lld 输出 "Ubuntu LLD 14.0.0" 让 LLD_VERSION 变成 00000。
          # 探测失败 -> CONFIG_HAS_LTO_CLANG=n -> LTO_CLANG_FULL 与 CFI_CLANG 被静默丢弃。
          # CFI 一旦丢失，struct module 少了 cfi 字段，module_layout 的 CRC 变化，
          # ramdisk 里所有预编译 .ko 都会报 "disagrees about version of symbol module_layout"。
          mkdir -p /tmp/fakebin
          printf '#!/bin/sh\nif [ "$1" = "--version" ]; then echo "llvm-ar version 14.0.0"; exit 0; fi\nexec /usr/bin/llvm-ar "$@"\n' > /tmp/fakebin/llvm-ar
          printf '#!/bin/sh\nif [ "$1" = "--version" ]; then echo "llvm-nm version 14.0.0"; exit 0; fi\nexec /usr/bin/llvm-nm "$@"\n' > /tmp/fakebin/llvm-nm
          printf '#!/bin/sh\nif [ "$1" = "--version" ]; then echo "LLD 14.0.0"; exit 0; fi\nexec /usr/bin/ld.lld "$@"\n' > /tmp/fakebin/ld.lld
          chmod +x /tmp/fakebin/llvm-ar /tmp/fakebin/llvm-nm /tmp/fakebin/ld.lld
          export PATH=/tmp/fakebin:$PATH
          echo "llvm-ar -> $(llvm-ar --version | head -1)"
          echo "llvm-nm -> $(llvm-nm --version | head -1)"
          echo "ld.lld  -> $(ld.lld --version | head -1)"

      - name: Neutralize -Werror (clang-14 vs old tree)
        run: |
          cd "$BUILD_DIR/common"
          # CONFIG_KVM_WERROR=y 会给 kvm 单独加 -Werror，Kconfig default y 关不掉，直接改 flag
          sed -i 's/-Werror/-Wno-error/g' arch/x86/kvm/Makefile
          sed -i 's/-Werror\b/-Wno-error/g' Makefile scripts/Makefile.extrawarn 2>/dev/null || true
          grep -n -- '-Werror' arch/x86/kvm/Makefile Makefile scripts/Makefile.extrawarn || echo 'no -Werror left'

      - name: Configure (stock config + exact LOCALVERSION + KSU builtin)
        run: |
          set -euxo pipefail
          export PATH=/tmp/fakebin:$PATH
          cd "$BUILD_DIR/common"
          cp "$GITHUB_WORKSPACE/stock.config" .config
          # 精确复刻原版内核 release 字符串，保证 /lib/modules 里的模块 vermagic 匹配
          scripts/config --set-str LOCALVERSION "-android12-9-00039-g62a5f8e3accf-ab7647044"
          scripts/config --disable LOCALVERSION_AUTO
          # clang14 对老代码的新告警在 CONFIG_WERROR=y 下会变成 error，关掉（不影响生成代码与 vermagic）
          scripts/config --disable WERROR
          # KernelSU 内建（不用模块）
          scripts/config --enable KSU
          # 原版 5.10 没打 indirect syscall 补丁，必须开启运行时补丁分发器。
          # 该选项在 5.10 上劫持 do_syscall_64；我们把 KSU 的入口钩子换成了 .entry.text 里的
          # 汇编跳板（patch 见 ksu-syscall-hook.patch），修掉原先裸 C 函数在入口中间执行导致的 panic。
          scripts/config --enable KSU_X86_PATCH_SYSCALL_DISPATCHER
          # ===== 驱动配置 =====
          # 保持 stock.config 原样：所有驱动都不设 =y/not set，由 ramdisk 里的预编译 .ko 模块加载。
          # 绝不能把 goldfish_pipe / virtio_* 改成内建 =y：内建版本在早期 probe 会失败
          # （实测 goldfish_pipe_probe 返回 -EINVAL），且不会重试 -> adbd 用不了 -> adb 永远 offline。
          # ===== LTO/CFI =====
          # 必须保持 stock.config 原样（LTO_CLANG_FULL / CFI_CLANG 开启）。
          # 原因：CONFIG_MODVERSIONS=y 时 ramdisk 的 .ko 要求 module_layout 的 CRC 与内核完全一致。
          # 而 LTO/CFI 会改变 struct module 布局，一旦关掉，module_layout CRC 变化 ->
          # 所有 .ko 报 "disagrees about version of symbol module_layout" -> Exec format error ->
          # 模块全部加载失败 -> 没有 goldfish_pipe -> adb offline。
          # KernelSU 在 5.10 上靠 syscall table 的 dispatcher slot 生效，不依赖 do_syscall_64 入口补丁，
          # 所以也不需要为它关 LTO/CFI。
          make ARCH=x86_64 LLVM=1 olddefconfig
          # 硬断言：LTO/CFI 必须真的被开启，否则 struct module 布局变化 -> module_layout CRC 不匹配
          # -> ramdisk 里所有 .ko 报 "disagrees about version of symbol module_layout" -> adb offline
          grep -q '^CONFIG_LTO_CLANG_FULL=y' .config || { echo 'FATAL: LTO_CLANG_FULL was dropped'; grep -E 'CONFIG_LTO|CONFIG_LLD|CONFIG_HAS_LTO' .config; exit 1; }
          grep -q '^CONFIG_CFI_CLANG=y' .config || { echo 'FATAL: CFI_CLANG was dropped'; grep -E 'CONFIG_CFI|CONFIG_LTO|CONFIG_LLD' .config; exit 1; }
          grep -q '^CONFIG_MODVERSIONS=y' .config || { echo 'FATAL: MODVERSIONS off'; exit 1; }
          rel=$(make -s ARCH=x86_64 LLVM=1 kernelrelease)
          echo "kernelrelease = $rel (expect $EXPECTED_RELEASE)"
          test "$rel" = "$EXPECTED_RELEASE"
          grep -E '^CONFIG_KSU=|^CONFIG_LOCALVERSION=|^CONFIG_VIRTIO_BLK=|^CONFIG_VIRTIO_PCI=|^CONFIG_GOLDFISH=|^CONFIG_GOLDFISH_PIPE=|^CONFIG_DRM_VIRTIO_GPU=|^CONFIG_DMABUF_HEAPS_SYSTEM=|^CONFIG_VIRTIO_INPUT=|^CONFIG_VIRTIO_NET=' .config

      - name: Build bzImage
        run: |
          export PATH=/tmp/fakebin:$PATH
          cd "$BUILD_DIR/common"
          set -o pipefail
          make ARCH=x86_64 LLVM=1 -j"$(nproc)" bzImage 2>&1 | tee build.log
          ls -lh arch/x86/boot/bzImage

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/ksu/common/build.log

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-ranchu-ksu
          include-hidden-files: true
          path: |
            /tmp/ksu/common/arch/x86/boot/bzImage
            /tmp/ksu/common/.config
          if-no-files-found: error
