name: build-goldfish-ksu

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "KernelSU tag / branch"
        required: true
        default: "v0.9.5"
      goldfish_tag:
        description: "goldfish branch/tag (android12-5.10)"
        required: true
        default: "android12-5.10"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-goldfish-ksu.yml"

env:
  KSU_REF: ${{ github.event.inputs.ksu_ref || 'v0.9.5' }}
  GOLDFISH_TAG: ${{ github.event.inputs.goldfish_tag || 'android12-5.10' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves rsync cpio kmod zstd \
            clang lld llvm python3 make git

      - name: Clone goldfish kernel source (5.10.43) from googlesource
        run: |
          # googlesource 官方源，分支 android12-5.10（对应 5.10.43-android12）
          git clone --depth 1 --branch "android12-5.10" \
            https://android.googlesource.com/kernel/goldfish goldfish
          cd goldfish
          echo "Commit: $(git rev-parse HEAD)"
          echo "Version: $(cat Makefile | grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL' | awk '{print $3}' | tr '\n' '.' | sed 's/\.$//')"

      - name: Clone KernelSU (compatible with 5.10)
        run: |
          if ! git clone --depth 1 --branch "$KSU_REF" \
               https://github.com/tiann/KernelSU.git KernelSU; then
            rm -rf KernelSU
            git clone --depth 1 https://github.com/tiann/KernelSU.git KernelSU
            cd KernelSU && git checkout v0.9.5 2>/dev/null || git checkout main
          fi
          ls KernelSU/kernel

      - name: Integrate KernelSU into goldfish tree
        run: |
          cd goldfish
          ln -sfn "$GITHUB_WORKSPACE/KernelSU/kernel" drivers/kernelsu
          grep -q 'CONFIG_KSU' drivers/Kbuild || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Kbuild
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo "--- drivers/Kbuild ---"; tail -3 drivers/Kbuild
          echo "--- drivers/Kconfig ---"; tail -3 drivers/Kconfig

      - name: Configure kernel (goldfish_x86_64_defconfig + all builtin)
        run: |
          cd goldfish
          make ARCH=x86_64 LLVM=1 goldfish_x86_64_defconfig
          # Enable required builtin drivers (no modules)
          scripts/config --enable KSU
          scripts/config --enable KALLSYMS
          scripts/config --enable KALLSYMS_ALL
          scripts/config --enable MODULES
          # Critical graphics/memory drivers for hwcomposer
          scripts/config --enable DMABUF_HEAPS_SYSTEM
          scripts/config --enable DRM_VIRTIO_GPU
          scripts/config --enable VIRTIO_DMA_SHARED_BUFFER
          scripts/config --enable GOLDFISH
          scripts/config --enable GOLDFISH_PIPE
          scripts/config --enable VIRTIO_BLK
          scripts/config --enable VIRTIO_PCI
          scripts/config --enable EXT4_FS
          scripts/config --disable DEBUG_INFO || true
          make ARCH=x86_64 LLVM=1 olddefconfig
          echo "=== key configs ==="
          grep -E 'CONFIG_KSU|CONFIG_KALLSYMS_ALL|CONFIG_DMABUF_HEAPS_SYSTEM|CONFIG_DRM_VIRTIO_GPU|CONFIG_VIRTIO_DMA_SHARED_BUFFER|CONFIG_GOLDFISH|CONFIG_GOLDFISH_PIPE|CONFIG_VIRTIO_BLK' .config

      - name: Build bzImage
        id: buildbz
        run: |
          cd goldfish
          set -o pipefail
          make ARCH=x86_64 LLVM=1 -j$(nproc) bzImage 2>&1 | tee build.log
          ls -lh arch/x86/boot/bzImage

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: goldfish/build.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goldfish-ksu-kernel
          path: |
            goldfish/arch/x86/boot/bzImage
            goldfish/.config
          if-no-files-found: error